name: Smoke Tests Sharded

# Manual run — use this to practice/learn sharding
on:
  workflow_dispatch:

jobs:
  smoke-sharded:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2] # 2 machines / 2 shards

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests (shard ${{ matrix.shard }}/2)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        # Combination: sharding (matrix) + parallel (workers from playwright.config.ts on CI = 2)
        run: npx playwright test tests/smoke --project=chromium --shard=${{ matrix.shard }}/2

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            reports/ai-failures/
          retention-days: 7
